<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>計画済み情報</title>
  <style>
    :root{--navy:#16324f;--blue:#1184bd;--soft:#eaf5fb;--line:#d5dee6;--ink:#243747;--muted:#667887;--paper:#f5f8fa;font-family:"Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0;min-width:1050px;background:var(--paper)}button,input,select{font:inherit}.app{padding:18px 20px 28px}.view-tabs{display:flex;gap:4px;margin-bottom:8px}.view-tab{border:1px solid #b8c5cf;border-radius:8px 8px 0 0;padding:8px 18px;background:#fff;color:var(--navy);font-weight:800;cursor:pointer}.view-tab.active{border-color:var(--navy);background:var(--navy);color:#fff}.toolbar{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px}h1{margin:0;color:var(--navy);font-size:26px}.month-tabs{display:flex;gap:7px}.month-button{border:1px solid #b8c5cf;border-radius:8px;padding:8px 18px;background:#fff;color:var(--navy);font-weight:800;cursor:pointer}.month-button.active{border-color:var(--blue);background:var(--blue);color:#fff}.filters{position:relative;z-index:20;display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr) minmax(260px,1.2fr) auto;gap:12px;align-items:end;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff}.filters label{display:grid;gap:5px;color:var(--navy);font-size:13px;font-weight:900}.filters input{width:100%;height:39px;border:1px solid #b7c4ce;border-radius:7px;padding:7px 10px;background:#fffdf0;color:var(--ink)}.customer-picker{position:relative;width:100%}.customer-button{position:relative;width:100%;height:39px;overflow:hidden;border:1px solid #b7c4ce;border-radius:7px;padding:7px 34px 7px 10px;background:#fffdf0;color:var(--ink);text-align:left;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.customer-button::after{content:"▼";position:absolute;right:11px;top:11px;color:var(--navy);font-size:11px}.customer-menu{position:absolute;top:43px;left:0;z-index:100;width:max(100%,300px);max-height:min(390px,calc(100vh - 205px));overflow-y:auto;overscroll-behavior:contain;border:1px solid #9fb3c1;border-radius:8px;background:#fffdf0;box-shadow:0 10px 28px rgba(22,50,79,.25)}.customer-menu[hidden],#customerFilter[hidden]{display:none}.customer-option{display:block;width:100%;border:0;border-bottom:1px solid #e0e6ea;padding:9px 12px;background:#fffdf0;color:var(--ink);text-align:left;cursor:pointer}.customer-option:hover,.customer-option.selected{background:#dff1fa;color:var(--navy);font-weight:800}.clear{height:39px;border:1px solid #b7c4ce;border-radius:7px;padding:7px 14px;background:#fff;color:var(--navy);font-weight:800;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.card{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}.card-label{color:var(--muted);font-size:12px;font-weight:800}.card-value{margin-top:2px;color:var(--navy);font-size:21px;font-weight:900}.table-wrap{overflow:auto;max-height:calc(100vh - 332px);border:1px solid #bdc9d2;border-radius:11px;background:#fff;box-shadow:0 8px 28px rgba(22,50,79,.07)}table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}th{position:sticky;top:0;z-index:5;padding:11px 10px;border-right:1px solid #49647d;background:var(--navy);color:#fff;text-align:left;white-space:nowrap}td{padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}tbody tr:hover{background:#f0f8fc}.code{font-weight:900;white-space:nowrap}.name,.material-name{min-width:190px}.number{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.empty-row td,.no-results{padding:34px;text-align:center;color:var(--muted)}.no-results{display:none}.updated{position:fixed;right:20px;bottom:8px;color:#70808b;font-size:12px}
  </style>
</head>
<body>
  <main class="app">
    <nav class="view-tabs" aria-label="画面の切り替え">
      <button class="view-tab" type="button" data-action="weekly">週間計画</button>
      <button class="view-tab" type="button" data-action="daily">デイリー計画</button>
      <button class="view-tab active" type="button">計画済み情報</button>
      <button class="view-tab" type="button" data-action="entrance">玄関表示</button>
      <button class="view-tab" type="button" data-action="master">マスター管理</button>
    </nav>
    <header class="toolbar"><h1>計画済み情報</h1><div class="month-tabs"><button class="month-button" data-month="{{PREV_KEY}}">先月　{{PREV_MONTH}}</button><button class="month-button active" data-month="{{CURRENT_KEY}}">今月　{{CURRENT_MONTH}}</button><button class="month-button" data-month="{{NEXT_KEY}}">来月　{{NEXT_MONTH}}</button></div></header>
    <section class="filters" aria-label="絞り込み">
      <label>得意先<div class="customer-picker"><button id="customerButton" class="customer-button" type="button">すべての得意先</button><div id="customerMenu" class="customer-menu" hidden></div><select id="customerFilter" hidden>{{CUSTOMER_OPTIONS}}</select></div></label>
      <label>品番<input id="codeFilter" type="text" placeholder="1文字ごとに絞り込み"></label>
      <label>品目名称<input id="nameFilter" type="text" placeholder="1文字ごとに絞り込み"></label>
      <button class="clear" id="clearButton" type="button">絞り込み解除</button>
    </section>
    <section class="cards" aria-label="表示中の合計"><div class="card"><div class="card-label">品目数</div><div class="card-value" id="itemTotal">0</div></div><div class="card"><div class="card-label">生産回数</div><div class="card-value" id="countTotal">0回</div></div><div class="card"><div class="card-label">総計画数</div><div class="card-value" id="qtyTotal">0個</div></div><div class="card"><div class="card-label">総生産時間</div><div class="card-value" id="hoursTotal">0.00h</div></div><div class="card"><div class="card-label">総材料使用量</div><div class="card-value" id="materialTotal">0.000kg</div></div></section>
    <section class="table-wrap"><table><thead><tr><th>品番</th><th>品目名称</th><th>生産回数</th><th>総計画数</th><th>総生産時間(h)</th><th>材料名</th><th>総材料使用量(kg)</th></tr></thead><tbody id="summaryBody">{{ROWS}}</tbody></table><div class="no-results" id="noResults">条件に一致する計画はありません。</div></section>
  </main>
  <div class="updated">{{UPDATED}}</div>
  <script>
    const sendAction=params=>location.href='action.html?'+new URLSearchParams(params).toString();
    document.querySelectorAll('[data-action]').forEach(element=>element.addEventListener('click',()=>sendAction({action:element.dataset.action})));
    const monthButtons=[...document.querySelectorAll('.month-button')],rows=[...document.querySelectorAll('#summaryBody tr[data-month]')],customer=document.getElementById('customerFilter'),customerButton=document.getElementById('customerButton'),customerMenu=document.getElementById('customerMenu'),code=document.getElementById('codeFilter'),name=document.getElementById('nameFilter');
    let selectedMonth=document.querySelector('.month-button.active').dataset.month;
    const integerFormat=new Intl.NumberFormat('ja-JP',{maximumFractionDigits:0});
    const decimalFormat=(value,digits)=>new Intl.NumberFormat('ja-JP',{minimumFractionDigits:digits,maximumFractionDigits:digits}).format(value);
    function applyFilters(){const customerValue=customer.value.toLowerCase(),codeValue=code.value.trim().toLowerCase(),nameValue=name.value.trim().toLowerCase();let itemTotal=0,countTotal=0,qtyTotal=0,hoursTotal=0,materialTotal=0;rows.forEach(row=>{const visible=row.dataset.month===selectedMonth&&(!customerValue||row.dataset.customer.toLowerCase()===customerValue)&&row.dataset.code.toLowerCase().includes(codeValue)&&row.dataset.name.toLowerCase().includes(nameValue);row.hidden=!visible;if(visible){itemTotal++;countTotal+=Number(row.dataset.count)||0;qtyTotal+=Number(row.dataset.qty)||0;hoursTotal+=Number(row.dataset.hours)||0;materialTotal+=Number(row.dataset.material)||0}});document.getElementById('itemTotal').textContent=integerFormat.format(itemTotal);document.getElementById('countTotal').textContent=integerFormat.format(countTotal)+'回';document.getElementById('qtyTotal').textContent=integerFormat.format(qtyTotal)+'個';document.getElementById('hoursTotal').textContent=decimalFormat(hoursTotal,2)+'h';document.getElementById('materialTotal').textContent=decimalFormat(materialTotal,3)+'kg';document.getElementById('noResults').style.display=itemTotal?'none':'block'}
    monthButtons.forEach(button=>button.addEventListener('click',()=>{selectedMonth=button.dataset.month;monthButtons.forEach(item=>item.classList.toggle('active',item===button));applyFilters()}));
    function buildCustomerMenu(){[...customer.options].forEach(option=>{const button=document.createElement('button');button.type='button';button.className='customer-option';button.textContent=option.textContent;button.dataset.value=option.value;button.classList.toggle('selected',option.selected);button.addEventListener('click',()=>{customer.value=option.value;customerButton.textContent=option.textContent;customerMenu.querySelectorAll('.customer-option').forEach(item=>item.classList.toggle('selected',item===button));customerMenu.hidden=true;applyFilters()});customerMenu.appendChild(button)})}
    [code,name].forEach(input=>input.addEventListener('input',applyFilters));
    customerButton.addEventListener('click',event=>{event.stopPropagation();customerMenu.hidden=!customerMenu.hidden});customerMenu.addEventListener('click',event=>event.stopPropagation());customerMenu.addEventListener('wheel',event=>event.stopPropagation());document.addEventListener('click',event=>{if(!event.target.closest('.customer-picker'))customerMenu.hidden=true});
    document.getElementById('clearButton').addEventListener('click',()=>{customer.value='';customerButton.textContent=customer.options[0].textContent;customerMenu.querySelectorAll('.customer-option').forEach((item,index)=>item.classList.toggle('selected',index===0));code.value='';name.value='';applyFilters()});
    buildCustomerMenu();applyFilters();
  </script>
</body>
</html>
