<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>稼働状況</title>
  <style>
    :root{--navy:#15344f;--run:#176d90;--scheduled:#f4a340;--stop:#fff500;--line:#c4cdd3;--paper:#f7f9fa;--ink:#111;--columns:3;font-family:"Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper)}body{padding:1.5vh 1.4vw}.screen{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:1.5vh}.header{display:flex;align-items:baseline;gap:2.2vw;padding:.7vh 1.2vw;border:0;background:#fff}.date{font-size:clamp(30px,3.4vw,64px);font-weight:500}.heading{font-size:clamp(30px,3.2vw,60px);font-weight:500}.clock{margin-left:auto;border:0;padding:0;background:transparent;color:#334d61;font-size:clamp(24px,2.6vw,48px);font-weight:800;cursor:pointer}.machines{display:grid;grid-template-columns:repeat(var(--columns),minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));grid-auto-flow:row;gap:1.7vh clamp(.7vw,1.3vw,2vw);min-height:0}.machine{display:grid;grid-template-rows:auto 1fr;gap:.7vh;min-width:0;min-height:0}.machine-name{display:grid;place-items:center;padding:.4vh .35vw;border:0;background:#fff;font-size:clamp(22px,2.5vw,48px);font-weight:700}.status{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15vh;min-height:0;border:0;border-radius:clamp(10px,1vw,18px);padding:.35vh .5vw;text-align:center;overflow:hidden}.status.running{background:var(--run);color:#fff}.status.scheduled{background:var(--scheduled);color:#111}.status.stopped{background:var(--stop);color:#111}.state{order:1;flex:0 0 auto;font-size:clamp(16px,1.42vw,28px);line-height:1.05;font-weight:900;letter-spacing:.22em;text-indent:.22em;white-space:nowrap}.status.scheduled .state{letter-spacing:.05em;text-indent:0}.time{order:2;flex:0 0 auto;margin:0;font-size:clamp(13px,1.02vw,20px);line-height:1.05;font-weight:800}.product{order:3;flex:0 0 auto;width:100%;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(13px,1.15vw,22px);line-height:1.05;font-weight:900}.status.scheduled .product{order:2;margin-top:.35vh}.information{display:grid;grid-template-rows:auto auto;border:0;background:#fff;overflow:hidden}.information-title{padding:.25vh .8vw;border:0;font-size:clamp(24px,2.5vw,46px);line-height:1.15}.ticker{position:relative;height:clamp(54px,7vh,90px);overflow:hidden;white-space:nowrap}.ticker-track{position:absolute;top:50%;left:100%;transform:translateY(-50%);display:inline-block;padding-left:2vw;font-size:clamp(27px,3vw,58px);font-weight:600;animation:ticker var(--duration,28s) linear infinite}.ticker-track.empty{left:0;width:100%;text-align:center;animation:none;color:#71818d}.updated{position:fixed;right:.7vw;bottom:.4vh;color:#6d7c87;font-size:12px}@keyframes ticker{from{transform:translate(0,-50%)}to{transform:translate(calc(-100% - 100vw),-50%)}}
  </style>
</head>
<body>
  <main class="screen" style="--columns:{{COLUMNS}}">
    <header class="header"><span class="date">{{DATE}}</span><span class="heading">稼働状況</span><button class="clock" id="clock" type="button" data-action="weekly" aria-label="週間計画へ戻る"></button></header>
    <section class="machines" aria-label="設備稼働状況">{{MACHINES}}</section>
    <section class="information"><div class="information-title">Information</div><div class="ticker"><div class="ticker-track {{INFO_CLASS}}" style="--duration:{{INFO_DURATION}}s">{{INFORMATION}}</div></div></section>
  </main>
  <div class="updated">{{UPDATED}}</div>
  <script>
    const sendAction=params=>location.href='action.html?'+new URLSearchParams(params).toString();
    document.querySelectorAll('[data-action]').forEach(element=>element.addEventListener('click',()=>sendAction({action:element.dataset.action})));
    document.querySelectorAll('.product').forEach(function(element){element.textContent=element.textContent.split(' / ')[0].trim()});
    function updateClock(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}
    updateClock();setInterval(updateClock,1000);
    setTimeout(()=>{window.location.href='action.html?action=refreshentrance'},60000);
  </script>
</body>
</html>
