<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>デイリー生産計画</title>
  <style>
    :root{--navy:#16324f;--blue:#1184bd;--soft:#eaf5fb;--line:#d5dee6;--ink:#243747;--muted:#667887;--paper:#f5f8fa;--conflict:#8e44ad;--memo:#ff3030;font-family:"Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0;min-width:1100px;background:var(--paper)}button{font:inherit}.app{padding:18px 20px 28px}.view-tabs{display:flex;gap:4px;margin-bottom:8px}.view-tab{border:1px solid #b8c5cf;border-radius:8px 8px 0 0;padding:8px 18px;background:#fff;color:var(--navy);font-weight:800;cursor:pointer}.view-tab.active{border-color:var(--navy);background:var(--navy);color:#fff}.toolbar{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:14px}.title{display:flex;align-items:baseline;gap:14px}h1{margin:0;color:var(--navy);font-size:26px;letter-spacing:.03em}.date{color:var(--muted);font-size:16px;font-weight:800}.day-nav{display:flex;align-items:center;gap:8px}.edit-state{padding:5px 9px;border-radius:999px;background:#fff3cd;color:#7a5a00;font-size:12px;font-weight:900}.edit-state.saved{background:#e7f4ea;color:#26713a}.nav-button{border:1px solid #b8c5cf;border-radius:8px;padding:8px 16px;background:#fff;color:var(--navy);font-weight:700;cursor:pointer}.nav-button.primary{border-color:var(--blue);background:var(--blue);color:#fff}.board{overflow:auto;max-height:calc(100vh - 145px);border:1px solid #bdc9d2;border-radius:12px;background:#fff;box-shadow:0 8px 28px rgba(22,50,79,.08)}.time-header,.machine-row{display:grid;grid-template-columns:118px minmax(1250px,1fr)}.time-header{position:sticky;top:0;z-index:20}.corner{position:sticky;left:0;z-index:24;display:grid;place-items:center;min-height:54px;background:var(--navy);color:#fff;font-weight:900}.hours{display:grid;grid-template-columns:repeat(24,1fr);min-height:54px;background:var(--navy);color:#fff}.hour{display:grid;place-items:center;border-left:1px solid rgba(255,255,255,.24);font-size:13px;font-weight:800}.machine-cell{position:sticky;left:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:94px;border-top:1px solid var(--line);border-right:1px solid var(--line);background:var(--soft);color:var(--navy);font-size:17px;font-weight:900}.add{border:0;border-radius:6px;padding:4px 11px;background:var(--blue);color:#fff;font-size:12px;font-weight:800;cursor:pointer}.timeline{position:relative;min-height:94px;border-top:1px solid var(--line);background:repeating-linear-gradient(to right,#fff 0,#fff calc(4.166666% - 1px),#dce4ea calc(4.166666% - 1px),#dce4ea 4.166666%)}.plan{position:absolute;height:64px;min-width:46px;overflow:hidden;border:0;border-left:5px solid #086995;border-radius:7px;padding:5px 8px;background:linear-gradient(135deg,#1184bd,#1598d3);color:#fff;text-align:left;box-shadow:0 3px 8px rgba(17,84,122,.2);cursor:pointer}.plan.conflict{border:3px solid #642b7c;border-left-width:6px;background:linear-gradient(135deg,var(--conflict),#a85fc5);box-shadow:0 3px 10px rgba(91,37,113,.35)}.plan:hover{filter:brightness(.95)}.plan-main,.plan-sub,.plan-memo{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.plan-main{font-size:13px;font-weight:900}.plan-sub{margin-top:2px;font-size:11px;font-weight:700}.plan-memo{margin-top:2px;color:var(--memo);font-size:11px;font-weight:900;text-shadow:0 0 1px #fff}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#a0aeba;font-size:13px}.notice{position:fixed;right:20px;bottom:18px;z-index:30;padding:10px 15px;border-radius:8px;background:#18384f;color:#fff;font-size:13px}.nav-button.primary:hover,.add:hover{background:#0872a5}
    .plan-type-tabs{display:flex;gap:6px;margin:0 0 8px}.plan-type-tab{border:1px solid #b8c5cf;border-radius:7px;padding:6px 15px;background:#fff;color:var(--navy);font-weight:800;cursor:pointer}.plan-type-tab.active[data-plan-mode="normal"]{border-color:#65aeca;background:#d9f0fa}.plan-type-tab.active[data-plan-mode="free"]{border-color:#dc8b32;background:#fde2c2}.plan{border-left-color:#4d9fc3;background:linear-gradient(135deg,#8ed0eb,#b8e3f3);color:#17364c}.plan .plan-memo{color:#d51f1f;text-shadow:none}.plan.free-plan{border-left-color:#d87816;background:linear-gradient(135deg,#f6b26b,#f9cb9c);color:#5f3308}.plan.free-plan .plan-memo{color:#c81717}.add.free-mode{background:#e18a2c}.add.free-mode:hover{background:#c87318}
  </style>
</head>
<body>
  <main class="app">
    <nav class="view-tabs" aria-label="計画表示の切り替え">
      <button class="view-tab" type="button" data-action="weekly">週間計画</button>
      <button class="view-tab active" type="button">デイリー計画</button>
      <button class="view-tab" type="button" data-action="plannedsummary">計画済み情報</button>
      <button class="view-tab" type="button" data-action="entrance">玄関表示</button>
      <button class="view-tab" type="button" data-action="master">マスター管理</button>
    </nav>
    <nav class="plan-type-tabs" aria-label="追加する計画の種類">
      <button class="plan-type-tab active" type="button" data-plan-mode="normal">通常計画</button>
      <button class="plan-type-tab" type="button" data-plan-mode="free">フリー計画</button>
    </nav>
    <header class="toolbar">
      <div class="title"><h1>デイリー生産計画</h1><span class="date">{{DATE}}</span></div>
      <nav class="day-nav" aria-label="日の切り替え">
        <span class="edit-state" id="editState">保存済み</span>
        <button class="nav-button" type="button" data-action="prevday">前日</button>
        <button class="nav-button primary" type="button" data-action="todayday">今日</button>
        <button class="nav-button" type="button" data-action="nextday">翌日</button>
      </nav>
    </header>
    <section class="board" aria-label="デイリー生産計画表">
      <div class="time-header"><div class="corner">設備</div><div class="hours">{{HOURS}}</div></div>
      {{ROWS}}
    </section>
  </main>
  <div class="notice">{{UPDATED}}</div>
  <script>
    const planModeKey='production-plan-input-mode';
    const hasChanges={{HAS_CHANGES}},editState=document.querySelector('#editState');
    editState.textContent=hasChanges?'未保存の変更あり（週間画面で保存）':'保存済み';editState.classList.toggle('saved',!hasChanges);
    function sendAction(params){window.location.href='action.html?'+new URLSearchParams(params).toString()}
    function applyPlanMode(mode){
      sessionStorage.setItem(planModeKey,mode);
      document.querySelectorAll('.plan-type-tab').forEach(button=>button.classList.toggle('active',button.dataset.planMode===mode));
      document.querySelectorAll('.add').forEach(button=>{button.classList.toggle('free-mode',mode==='free');button.textContent=mode==='free'?'＋フリー':'＋追加'});
    }
    document.querySelectorAll('.plan-type-tab').forEach(button=>button.addEventListener('click',()=>applyPlanMode(button.dataset.planMode)));
    document.querySelectorAll('.plan').forEach(plan=>plan.addEventListener('contextmenu',event=>event.preventDefault()));
    document.querySelectorAll('[data-action]').forEach(element=>{
      element.addEventListener('click',()=>{
        const action=element.dataset.action;
        if(hasChanges&&['plannedsummary','entrance','master'].includes(action)){alert('未保存の変更があります。週間画面へ戻り、「保存」または「変更取消」を押してください。');return}
        if(action==='add'){const mode=sessionStorage.getItem(planModeKey)||'normal';sendAction({action:mode==='free'?'addfree':'add',date:element.dataset.date,machine:element.dataset.machine,view:'daily'});}
        else if(action==='edit'||action==='editfree') sendAction({action,id:element.dataset.planId,view:'daily'});
        else sendAction({action});
      });
    });
    applyPlanMode(sessionStorage.getItem(planModeKey)||'normal');
  </script>
</body>
</html>
