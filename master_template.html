<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>マスター管理</title>
  <style>
    :root{--navy:#16324f;--blue:#1184bd;--soft:#eaf5fb;--line:#d5dee6;--ink:#243747;--muted:#667887;--paper:#f5f8fa;font-family:"Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0;min-width:1050px;background:var(--paper)}button,input,textarea{font:inherit}[hidden]{display:none!important}.app{padding:18px 20px 28px}.view-tabs,.master-tabs{display:flex;gap:4px}.view-tabs{margin-bottom:14px}.view-tab,.master-tab{border:1px solid #b8c5cf;border-radius:8px 8px 0 0;padding:8px 18px;background:#fff;color:var(--navy);font-weight:800;cursor:pointer}.view-tab.active,.master-tab.active{border-color:var(--navy);background:var(--navy);color:#fff}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px}h1{margin:0;color:var(--navy);font-size:26px}.actions{display:flex;gap:8px}.button{border:1px solid #b8c5cf;border-radius:8px;padding:8px 14px;background:#fff;color:var(--navy);font-weight:800;cursor:pointer}.button.primary{border-color:var(--blue);background:var(--blue);color:#fff}.button.danger{border-color:#be2d37;background:#be2d37;color:#fff}.panel{display:none}.panel.active{display:block}.filters{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px 10px 0 0;background:#fff}.filters label{font-weight:800;color:var(--navy)}.filters input[type=text]{width:190px;border:1px solid #b7c4ce;border-radius:6px;padding:7px 9px;background:#fffdf0}.check{display:flex;align-items:center;gap:6px;margin-left:auto}.table-wrap{overflow:auto;max-height:calc(100vh - 245px);border:1px solid var(--line);border-top:0;background:#fff}table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;white-space:nowrap}th{position:sticky;top:0;z-index:5;padding:10px 8px;border-right:1px solid #49647d;background:var(--navy);color:#fff;text-align:left}td{padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}tbody tr:hover{background:#f0f8fc}.staff-actions{display:flex;gap:4px}.edit,.move,.delete-info{border:0;border-radius:6px;padding:5px 10px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.move{min-width:30px;padding:5px 7px;background:var(--navy)}.delete-info{background:#be2d37}.old{color:#8997a1;background:#f6f7f8}.empty{padding:28px;text-align:center;color:var(--muted)}.info-entry{padding:16px;border:1px solid var(--line);border-radius:10px 10px 0 0;background:#fff}.info-content{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}.info-content label,.period label{font-weight:800;color:var(--navy)}.info-content textarea{width:min(900px,80vw);height:72px;margin-left:10px;padding:8px;border:1px solid #b7c4ce;border-radius:6px;background:#fffdf0;resize:vertical}.period{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.period label{display:grid;gap:5px}.period input{width:145px;padding:7px 9px;border:1px solid #b7c4ce;border-radius:6px;background:#fffdf0}.period .time{width:90px}.period-mark{padding:0 5px 8px}.info-note{margin-top:10px;color:var(--muted);font-size:13px}.info-table-wrap{max-height:calc(100vh - 385px)}.info-content-cell{min-width:420px;max-width:760px;white-space:normal}
  </style>
</head>
<body>
  <main class="app">
    <nav class="view-tabs"><button class="view-tab" data-action="weekly">週間計画</button><button class="view-tab" data-action="daily">デイリー計画</button><button class="view-tab" data-action="plannedsummary">計画済み情報</button><button class="view-tab" data-action="entrance">玄関表示</button><button class="view-tab active">マスター管理</button></nav>
    <div class="heading"><h1>マスター管理</h1><div class="actions"><button class="button" data-action="productImport">製品CSV取込</button><button class="button" data-action="productExport">製品CSV出力</button><button class="button primary new-button" data-action="masterNew" data-type="product">＋ 新規作成</button></div></div>
    <nav class="master-tabs"><button class="master-tab active" data-tab="product">製品マスター</button><button class="master-tab" data-tab="machine">設備マスター</button><button class="master-tab" data-tab="staff">担当者マスター</button><button class="master-tab" data-tab="information">Information</button></nav>
    <section class="panel active" data-panel="product"><div class="filters"><label>コード <input type="text" class="code-filter" placeholder="品番"></label><label>名称 <input type="text" class="name-filter" placeholder="品目名称"></label><label class="check"><input type="checkbox" class="latest-only" checked>最新の情報のみ表示</label></div><div class="table-wrap"><table><thead><tr><th>編集</th><th>品番</th><th>品目名称</th><th>金型番号</th><th>角番</th><th>設備</th><th>TON数</th><th>材料コード</th><th>材料名</th><th>重量／1ヶ</th><th>サイクルタイム(s)</th><th>SET/MULTI</th><th>取数</th><th>備考</th><th>SNP</th><th>納品先コード</th><th>納品先</th></tr></thead><tbody>{{PRODUCT_ROWS}}</tbody></table></div></section>
    <section class="panel" data-panel="machine"><div class="filters"><label>コード <input type="text" class="code-filter" placeholder="設備コード"></label><label>名称 <input type="text" class="name-filter" placeholder="設備名称"></label><label class="check"><input type="checkbox" class="latest-only" checked>最新の情報のみ表示</label></div><div class="table-wrap"><table><thead><tr><th>編集</th><th>設備コード</th><th>設備名称</th><th>TON</th><th>表示順</th><th>適用開始</th><th>失効日</th></tr></thead><tbody>{{MACHINE_ROWS}}</tbody></table></div></section>
    <section class="panel" data-panel="staff"><div class="filters"><label>コード <input type="text" class="code-filter" placeholder="担当者コード"></label><label>名称 <input type="text" class="name-filter" placeholder="担当者名"></label><label class="check"><input type="checkbox" class="latest-only" checked>最新の情報のみ表示</label></div><div class="table-wrap"><table><thead><tr><th>編集・表示順</th><th>担当者コード</th><th>担当者名</th><th>適用開始</th><th>失効日</th></tr></thead><tbody>{{STAFF_ROWS}}</tbody></table></div></section>
    <section class="panel" data-panel="information">
      <div class="info-entry">
        <div class="info-content"><label for="infoContent">内容</label><textarea id="infoContent" maxlength="500" placeholder="玄関表示に流す内容を入力"></textarea></div>
        <div class="period"><label>表示開始日<input id="infoStartDate" type="text" inputmode="numeric" placeholder="yyyymmdd"></label><label>時刻<input id="infoStartTime" class="time" type="text" inputmode="numeric" placeholder="HH:MM"></label><span class="period-mark">～</span><label>表示終了日<input id="infoEndDate" type="text" inputmode="numeric" placeholder="yyyymmdd"></label><label>時刻<input id="infoEndTime" class="time" type="text" inputmode="numeric" placeholder="HH:MM"></label><button id="infoSaveButton" class="button primary" type="button" data-action="informationAdd">登録</button><button id="infoDeleteButton" class="button danger" type="button" data-action="informationDeleteEditing" hidden>削除</button><button id="infoCancelButton" class="button" type="button" data-action="informationCancel" hidden>キャンセル</button></div>
        <div class="info-note">最大10件まで登録できます。表示終了時刻を過ぎたInformationは自動で削除されます。</div>
      </div>
      <div class="table-wrap info-table-wrap"><table><thead><tr><th>編集・削除</th><th>内容</th><th>表示開始</th><th>表示終了</th></tr></thead><tbody>{{INFORMATION_ROWS}}</tbody></table></div>
    </section>
  </main>
  <script>
    const sendAction=params=>location.href='action.html?'+new URLSearchParams(params).toString();
    let activeType='{{ACTIVE_TYPE}}',editingInformationId=0;
    function selectMasterTab(type){activeType=type;document.querySelectorAll('.master-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===activeType));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.dataset.panel===activeType));const product=activeType==='product',standard=activeType!=='information';document.querySelector('[data-action="productImport"]').style.display=product?'':'none';document.querySelector('[data-action="productExport"]').style.display=product?'':'none';const newButton=document.querySelector('.new-button');newButton.style.display=standard?'':'none';if(standard)newButton.dataset.type=activeType;const panel=document.querySelector(`[data-panel="${activeType}"]`);if(panel.querySelector('.code-filter'))filterPanel(panel)}
    document.querySelectorAll('.master-tab').forEach(button=>button.addEventListener('click',()=>selectMasterTab(button.dataset.tab)));
    function filterPanel(panel){const code=panel.querySelector('.code-filter').value.toLowerCase(),name=panel.querySelector('.name-filter').value.toLowerCase(),latest=panel.querySelector('.latest-only').checked;panel.querySelectorAll('tbody tr').forEach(row=>{row.hidden=!row.dataset.code.toLowerCase().includes(code)||!row.dataset.name.toLowerCase().includes(name)||(latest&&row.dataset.latest!=='1')})}
    document.querySelectorAll('.filters input').forEach(input=>input.addEventListener('input',()=>filterPanel(input.closest('.panel'))));
    const hexText=value=>{let result=[];for(let i=0;i<value.length;i++)result.push(value.charCodeAt(i).toString(16));return result.join('.')};
    function clearInformationEdit(){editingInformationId=0;document.querySelector('#infoContent').value='';document.querySelector('#infoStartDate').value='';document.querySelector('#infoStartTime').value='';document.querySelector('#infoEndDate').value='';document.querySelector('#infoEndTime').value='';document.querySelector('#infoSaveButton').textContent='登録';document.querySelector('#infoDeleteButton').hidden=true;document.querySelector('#infoCancelButton').hidden=true}
    document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{const action=button.dataset.action;if(action==='masterNew')sendAction({action,type:button.dataset.type});else if(action==='masterEdit')sendAction({action,type:button.dataset.type,id:button.dataset.id});else if(action==='staffMove')sendAction({action,id:button.dataset.id,direction:button.dataset.direction});else if(action==='informationEdit'){editingInformationId=Number(button.dataset.id);document.querySelector('#infoContent').value=button.dataset.content;document.querySelector('#infoStartDate').value=button.dataset.startDate;document.querySelector('#infoStartTime').value=button.dataset.startTime;document.querySelector('#infoEndDate').value=button.dataset.endDate;document.querySelector('#infoEndTime').value=button.dataset.endTime;document.querySelector('#infoSaveButton').textContent='上書き保存';document.querySelector('#infoDeleteButton').hidden=false;document.querySelector('#infoCancelButton').hidden=false;document.querySelector('#infoContent').focus()}else if(action==='informationDelete')sendAction({action,id:button.dataset.id});else if(action==='informationDeleteEditing'){if(editingInformationId)sendAction({action:'informationDelete',id:editingInformationId})}else if(action==='informationCancel')clearInformationEdit();else if(action==='informationAdd'){const content=document.querySelector('#infoContent').value.trim(),startDate=document.querySelector('#infoStartDate').value.trim().replace(/[\/-]/g,''),startTime=document.querySelector('#infoStartTime').value.trim().replace(':',''),endDate=document.querySelector('#infoEndDate').value.trim().replace(/[\/-]/g,''),endTime=document.querySelector('#infoEndTime').value.trim().replace(':','');if(!content||!startDate||!startTime||!endDate||!endTime){alert('内容と表示開始・終了日時をすべて入力してください。');return}sendAction({action,id:editingInformationId,contentHex:hexText(content),startDate,startTime,endDate,endTime})}else sendAction({action})}));
    selectMasterTab(activeType);
  </script>
</body>
</html>
